<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>
</head>
<body>

    <h1 id="clock"></h1>

    <script>
        function showTime() {
            let time = new Date().toLocaleTimeString();
            document.getElementById("clock").innerHTML = time;
        }

        setInterval(showTime, 1000);

        showTime();
    </script>

</body>
</html>
